# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "Change the state of a review, problem, question or challenge"
description: "Withdraw what you wrote; mark a problem fixed, intended or not a problem; a question answered; a challenge met, failed or declined; reopen."
title: "Status: "
labels: ["evidence:status"]
body:
  - type: markdown
    attributes:
      value: "Usually opened from the buttons of a page, with the record's id filled in. It is recorded if your account may make the change: the author of a record can withdraw it; the reporter of a problem, the asker of a question, the author of a challenge and the maintainers can resolve or reopen it. The same changes can be made by commenting on the record's own issue (`/withdraw`, `/fixed <commit>`, `/met <declaration>`, …)."
  - type: input
    id: record
    attributes:
      label: "Record"
      description: "The id of the record: 16 hexadecimal digits."
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: "Change"
      description: "One of: withdraw, fixed, intended, invalid, answered, met, failed, declined, reopen."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Fixed in"
      description: "For `fixed`: the commit that fixed it."
  - type: input
    id: test
    attributes:
      label: "Met by"
      description: "For `met`: the full name of the declaration that proves the challenge."
  - type: textarea
    id: note
    attributes:
      label: "Note"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
