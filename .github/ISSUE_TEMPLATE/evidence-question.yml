# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "Ask a question about a declaration"
description: "What is it at 0? Why this convention?"
title: "Question: "
labels: ["evidence:question"]
body:
  - type: markdown
    attributes:
      value: "Answers are comments on this issue. The asker or a maintainer closes it with `/answered`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: textarea
    id: question
    attributes:
      label: "Question"
    validations:
      required: true
  - type: dropdown
    id: involvement
    attributes:
      label: "You are"
      options:
        - "an outsider to this library"
        - "a contributor to this library"
        - "the author of this declaration"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
