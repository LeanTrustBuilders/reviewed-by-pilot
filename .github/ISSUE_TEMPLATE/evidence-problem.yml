# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "Report a problem with a declaration"
description: "It does not mean what it should."
title: "Problem: "
labels: ["evidence:problem"]
body:
  - type: markdown
    attributes:
      value: "A problem stays open until its reporter or a maintainer comments `/fixed <commit>`, `/intended` or `/invalid`. Comments on this issue are recorded as replies."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: dropdown
    id: category
    attributes:
      label: "What is wrong"
      options:
        - "a different object"
        - "a different convention"
        - "different edge cases"
        - "a junk value"
        - "vacuous or trivial"
        - "an arbitrary choice"
        - "less general than the source"
        - "a misleading name or docstring"
        - "something else"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "The counterexample, the case, or the step that fails."
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: "Suggested fix"
      description: "Optional: what it should be, in Lean or in words."
  - type: dropdown
    id: involvement
    attributes:
      label: "You are"
      options:
        - "an outsider to this library"
        - "a contributor to this library"
        - "the author of this declaration"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
