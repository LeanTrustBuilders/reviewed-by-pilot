# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "Review a declaration"
description: "Say that a declaration means what it should, and what you checked."
title: "Review: "
labels: ["evidence:review"]
body:
  - type: markdown
    attributes:
      value: "A review is a judgement about **meaning**: does this declaration say what it is supposed to say? It is recorded in the repository's evidence store under your GitHub account, and goes stale by itself if the declaration, or anything it rests on, changes."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: input
    id: reference
    attributes:
      label: "Compared with"
      description: "What you compared it with: a book or paper and section, a URL, or \"my own knowledge\"."
  - type: checkboxes
    id: checked
    attributes:
      label: "What you checked"
      description: "Tick what you checked. What is left unticked is shown as not checked."
      options:
        - label: "F1: the intended object, not a different notion"
        - label: "F2: its conventions: normalization, indexing, signs"
        - label: "F3: its edge cases: degenerate or boundary inputs"
        - label: "F4: junk values: defaults outside the intended domain"
        - label: "F5: not vacuous, not trivial"
        - label: "F6: no arbitrary choice"
        - label: "F7: what it rests on: the definitions and instances underneath"
        - label: "F9: its generality, against the source's"
        - label: "naming: its name and docstring do not mislead"
  - type: textarea
    id: caveats
    attributes:
      label: "Caveats"
      description: "One per line, starting with the failure mode: `F3: false at n = 0`."
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "Optional for people, required for AI agents."
  - type: dropdown
    id: involvement
    attributes:
      label: "You are"
      options:
        - "an outsider to this library"
        - "a contributor to this library"
        - "the author of this declaration"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
