# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "Name a result or notable definition"
description: "Point readers at what matters: a named theorem, a notable definition."
title: "Named: "
labels: ["evidence:named"]
body:
  - type: markdown
    attributes:
      value: "Most of a library is API and steps of proofs. A name marks a declaration out as one to read first."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: input
    id: name
    attributes:
      label: "Name"
      description: "What mathematicians call it: \"Dirichlet's unit theorem\"."
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: "It is"
      options:
        - "a named result"
        - "a notable definition"
  - type: textarea
    id: about
    attributes:
      label: "In one sentence"
  - type: input
    id: source
    attributes:
      label: "Named where"
      description: "Optional: a paper, a roadmap, a URL."
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
