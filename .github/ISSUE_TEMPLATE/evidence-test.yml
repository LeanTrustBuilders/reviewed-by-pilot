# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "List a test of a declaration"
description: "A declaration of the library that tests it: a value, a degenerate case, an agreement."
title: "Test: "
labels: ["evidence:test"]
body:
  - type: markdown
    attributes:
      value: "A test is a declaration of the library that pins another down. It is not a judgement: Lean checks it at every commit, and the page shows it as passing while it is there without `sorry`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: input
    id: test
    attributes:
      label: "Tested by"
      description: "The full name of the declaration that tests it, e.g. `MyLib.Foo.bar_zero`."
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: "What it checks"
      description: "Optional for people, required for AI agents."
  - type: input
    id: meets
    attributes:
      label: "Meets the challenge"
      description: "Optional: the id of a challenge it meets (16 hexadecimal digits)."
  - type: dropdown
    id: involvement
    attributes:
      label: "You are"
      options:
        - "an outsider to this library"
        - "a contributor to this library"
        - "the author of this declaration"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
