# Generated by evidence-store (`evidence-store init`); edit the definitions in
# evidence_store/forms.py rather than this file.
name: "Propose a test of a declaration"
description: "A property it should have, for someone to prove in the library."
title: "Challenge: "
labels: ["evidence:challenge"]
body:
  - type: markdown
    attributes:
      value: "A challenge is a **proposed test**: something the declaration should satisfy if it means what it should (a value, an edge case, agreement with another notion). It stays open until someone proves it in the library and comments `/met <the declaration that proves it>`; `/failed` says the declaration does not have the property (then report the problem), and a maintainer can comment `/declined`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: textarea
    id: property
    attributes:
      label: "What it should satisfy"
      description: "In words, or in Lean: `vonMangoldt 1 = 0`, \"agrees with Mathlib's … on …\"."
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: "As a Lean statement"
      description: "Optional: the statement to prove, as you would write it after `theorem`."
  - type: textarea
    id: catches
    attributes:
      label: "What it would catch"
      description: "Optional: what a wrong definition would get wrong here."
  - type: checkboxes
    id: modes
    attributes:
      label: "Kinds of problem it would catch"
      description: "Optional: which of the ways a declaration goes wrong it would catch."
      options:
        - label: "object: a different object"
        - label: "convention: a different convention"
        - label: "edge-cases: different edge cases"
        - label: "junk: a junk value"
        - label: "vacuous: vacuous or trivial"
        - label: "choice: an arbitrary choice"
        - label: "generality: less general than the source"
        - label: "naming: a misleading name or docstring"
  - type: dropdown
    id: involvement
    attributes:
      label: "You are"
      options:
        - "an outsider to this library"
        - "a contributor to this library"
        - "the author of this declaration"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
