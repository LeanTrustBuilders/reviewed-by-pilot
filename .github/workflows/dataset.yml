name: Dataset

# Extracts a dataset (S2) from Tau Ceti at a commit with trust-extract, and publishes it as the
# release `dataset-<commit>` of this repository, where every other workflow finds it.
#
# Tau Ceti's modules come from its public Lake cache and Mathlib's from Mathlib's, so little is
# compiled: only what the cache lacks. A module that does not build is left out, and the dataset
# says so (library.unavailable). trust-extract is the newest release of LeanTrustBuilders/extractor
# for Tau Ceti's toolchain.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The Tau Ceti commit (default the one pinned in data/settings.json)
        required: false
  workflow_call:
    inputs:
      commit:
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: dataset-${{ inputs.commit || 'pinned' }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Which commit
        run: |
          commit="${{ inputs.commit }}"
          [ -n "$commit" ] || commit=$(python3 -c "import json; print(json.load(open('data/settings.json'))['tauceti'])")
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "TAG=dataset-${commit:0:12}" >> "$GITHUB_ENV"
      - name: Already published?
        id: published
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The dataset for $COMMIT is already published as $TAG"; echo "done=true" >> "$GITHUB_OUTPUT"
          else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Room on the runner
        if: steps.published.outputs.done != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # Every imported module maps several files: allow more mappings per process, so that the
          # extraction needs fewer parts.
          sudo sysctl -w vm.max_map_count=262144
          df -h / | tail -1
      - name: Check out Tau Ceti
        if: steps.published.outputs.done != 'true'
        run: |
          git clone -q --filter=blob:none https://github.com/TauCetiProject/TauCeti "$RUNNER_TEMP/TauCeti"
          git -C "$RUNNER_TEMP/TauCeti" checkout -q "$COMMIT"
          cat "$RUNNER_TEMP/TauCeti/lean-toolchain"
      - name: Lean
        if: steps.published.outputs.done != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tau Ceti and Mathlib from their caches
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/TauCeti
        run: |
          lake exe cache get
          bash scripts/lake-cache-get.sh .
          # The cache can lag behind the newest commits: build whatever it does not have. A module
          # that does not build at this commit is left out of the dataset, with its importers.
          if ! lake build --no-build > /dev/null 2>&1; then
            echo "::notice::Not every module is in the cache; building the rest"
            lake build 2>&1 | tail -5 || true
          fi
          { lake build --no-build 2>&1 || true; } | sed -n '/logged failures/,$s/^- //p' > "$RUNNER_TEMP/unbuilt.txt"
          if [ -s "$RUNNER_TEMP/unbuilt.txt" ]; then
            echo "::warning::$(wc -l < "$RUNNER_TEMP/unbuilt.txt") modules do not build at $COMMIT and are left out: $(paste -sd' ' "$RUNNER_TEMP/unbuilt.txt")"
          fi
      - name: trust-extract for Tau Ceti's toolchain
        if: steps.published.outputs.done != 'true'
        run: |
          toolchain=$(sed 's/.*:v//' "$RUNNER_TEMP/TauCeti/lean-toolchain")
          # The newest release for this toolchain: tagged v<version>-lean-v<toolchain> (the first
          # one was tagged v<toolchain>).
          tag=$(gh release list -R LeanTrustBuilders/extractor --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName == \"v$toolchain\" or (.tagName | endswith(\"-lean-v$toolchain\")))] | sort_by(.createdAt) | last | .tagName // empty")
          if [ -z "$tag" ] || ! gh release download "$tag" -R LeanTrustBuilders/extractor -p 'trust-extract-linux-x86_64.tar.gz' -D "$RUNNER_TEMP"; then
            echo "::error::LeanTrustBuilders/extractor has no release for Lean v$toolchain yet"; exit 1
          fi
          echo "trust-extract release $tag"
          tar -xzf "$RUNNER_TEMP/trust-extract-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/trust-extract/trust-extract" version
      - name: Extract
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/TauCeti
        run: |
          lake env "$RUNNER_TEMP/trust-extract/trust-extract" extract --root TauCeti \
            --repo TauCetiProject/TauCeti --out "$RUNNER_TEMP/dataset" --parts 8 --jobs 1 \
            --skip-modules-file "$RUNNER_TEMP/unbuilt.txt"
          du -sh "$RUNNER_TEMP/dataset"
      - name: Publish
        if: steps.published.outputs.done != 'true'
        run: |
          tar -czf "$RUNNER_TEMP/dataset.tar.gz" -C "$RUNNER_TEMP/dataset" .
          gh release create "$TAG" "$RUNNER_TEMP/dataset.tar.gz" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "Dataset for Tau Ceti ${COMMIT:0:12}" \
            --notes "Extracted by trust-extract from TauCetiProject/TauCeti@$COMMIT. Spec: ltb-dataset/0 (LeanTrustBuilders/specs)."
