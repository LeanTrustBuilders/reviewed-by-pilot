name: Dataset

# Extracts a dataset (S2) from Tau Ceti at a commit with trust-extract, and publishes it as the
# release `dataset-<commit>` of this repository, where every other workflow finds it.
#
# Tau Ceti's modules come from its public Lake cache and Mathlib's from Mathlib's, so little is
# compiled: only what the cache lacks. A module that does not build is left out, and the dataset
# says so (library.unavailable). The extractor's action does the rest: the newest trust-extract
# release for Tau Ceti's toolchain, and the release.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The Tau Ceti commit (default the one pinned in data/settings.json)
        required: false
      replace:
        description: Extract it again and replace the published dataset (for a new extractor release)
        type: boolean
        default: false
  workflow_call:
    inputs:
      commit:
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: dataset-${{ inputs.commit || 'pinned' }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Which commit
        run: |
          commit="${{ inputs.commit }}"
          [ -n "$commit" ] || commit=$(python3 -c "import json; print(json.load(open('data/settings.json'))['tauceti'])")
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "TAG=dataset-${commit:0:12}" >> "$GITHUB_ENV"
      - name: Already published?
        id: published
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              echo "The dataset for $COMMIT is published as $TAG: extracting it again to replace it"; echo "done=false" >> "$GITHUB_OUTPUT"
            else
              echo "The dataset for $COMMIT is already published as $TAG"; echo "done=true" >> "$GITHUB_OUTPUT"
            fi
          else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Room on the runner
        if: steps.published.outputs.done != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Check out Tau Ceti
        if: steps.published.outputs.done != 'true'
        run: |
          git clone -q --filter=blob:none https://github.com/TauCetiProject/TauCeti "$RUNNER_TEMP/TauCeti"
          git -C "$RUNNER_TEMP/TauCeti" checkout -q "$COMMIT"
          cat "$RUNNER_TEMP/TauCeti/lean-toolchain"
      - name: Lean
        if: steps.published.outputs.done != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tau Ceti and Mathlib from their caches
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/TauCeti
        run: |
          lake exe cache get
          bash scripts/lake-cache-get.sh .
          # The cache can lag behind the newest commits: build whatever it does not have. A module
          # that does not build at this commit is left out of the dataset, with its importers.
          if ! lake build --no-build > /dev/null 2>&1; then
            echo "::notice::Not every module is in the cache; building the rest"
            lake build 2>&1 | tail -5 || true
          fi
          { lake build --no-build 2>&1 || true; } | sed -n '/logged failures/,$s/^- //p' > "$RUNNER_TEMP/unbuilt.txt"
          if [ -s "$RUNNER_TEMP/unbuilt.txt" ]; then
            echo "::warning::$(wc -l < "$RUNNER_TEMP/unbuilt.txt") modules do not build at $COMMIT and are left out: $(paste -sd' ' "$RUNNER_TEMP/unbuilt.txt")"
          fi
      - name: Extract and publish
        if: steps.published.outputs.done != 'true'
        uses: LeanTrustBuilders/extractor/extract@main
        with:
          root: TauCeti
          repo: TauCetiProject/TauCeti
          directory: ${{ runner.temp }}/TauCeti
          # This page shows neither statements taken apart nor hovers: the three --no flags keep the
          # dataset at the size it had before trust-extract 0.4 (Tau Ceti's would otherwise double).
          args: >-
            --parts 8 --jobs 1 --skip-modules-file ${{ runner.temp }}/unbuilt.txt
            --no-statements --no-signatures --no-upstream-docs
          publish: ${{ env.TAG }}
          replace: ${{ inputs.replace || 'false' }}
          title: Dataset for Tau Ceti ${{ env.COMMIT }}
