name: Record review marks

# Records marks from the "Review a definition" form (label `review`) and from
# `Reviewed-by:` and `Test:` lines in comments on an issue labelled `reviews`;
# and the issues that stay open, problem reports (label `problem`) and suggested
# tests (label `test-suggestion`): when one is opened or edited, and when it is
# closed (done, or not) or reopened. Then rebuilds the page. The ledgers are
# committed directly: no pull request.
on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# One writer of the ledger at a time.
concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  record:
    if: >-
      (github.event_name == 'issues' && github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'review') &&
       (github.event.action == 'opened' || github.event.action == 'edited')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'problem') || contains(github.event.issue.labels.*.name, 'test-suggestion')) &&
       (github.event.issue.state == 'open' || github.event.action == 'closed')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.type != 'Bot' &&
       contains(github.event.issue.labels.*.name, 'reviews'))
    runs-on: ubuntu-latest
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: declarations
        uses: ./.github/actions/declarations
        with:
          token: ${{ github.token }}
      - name: Read the marks or the report
        id: record
        run: python3 scripts/reviews.py from-event "$GITHUB_EVENT_PATH" --reply "$RUNNER_TEMP/reply.md" --out "$GITHUB_OUTPUT"
      - name: Record them as evidence (S3), keyed by the dataset's hashes
        if: steps.record.outputs.recorded != '0' && steps.declarations.outputs.dataset != ''
        run: python3 scripts/evidence_sync.py --dataset "${{ steps.declarations.outputs.dataset }}"
      - name: Save the ledger
        if: steps.record.outputs.recorded != '0'
        env:
          MESSAGE: ${{ steps.record.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews
          git commit -q -m "$MESSAGE"
          for attempt in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((attempt * 5)); done
          exit 1
      - name: Answer on the issue
        if: always() && steps.record.outcome == 'success'
        env:
          NUMBER: ${{ steps.record.outputs.number }}
          CLOSE: ${{ steps.record.outputs.close }}
          INVALID: ${{ steps.record.outputs.invalid }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          INCOMPLETE: ${{ contains(github.event.issue.labels.*.name, 'incomplete') }}
        run: |
          if [ -s "$RUNNER_TEMP/reply.md" ]; then gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"; fi
          if [ "$CLOSE" = "true" ]; then gh issue close "$NUMBER" --reason completed; fi
          # A form the bot could not read is labelled until an edit fixes it.
          if [ "$EVENT" = "issues" ] && { [ "$ACTION" = "opened" ] || [ "$ACTION" = "edited" ]; }; then
            if [ "${INVALID:-0}" != "0" ]; then gh issue edit "$NUMBER" --add-label incomplete
            elif [ "$INCOMPLETE" = "true" ]; then gh issue edit "$NUMBER" --remove-label incomplete; fi
          fi
  site:
    needs: record
    if: needs.record.outputs.recorded != '0'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
