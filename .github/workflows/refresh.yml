name: Follow Tau Ceti

# Moves the page to Tau Ceti's current main once a day, and reads the named
# results and notable definitions out of the roadmaps' status files again, so
# the page keeps up as the library grows. Marks stay pinned to the versions they
# were made on: a declaration that changed shows its marks greyed until someone
# reviews it again.
on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.pin.outputs.moved }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the roadmaps' named results
        run: |
          git clone -q --depth 1 https://github.com/TauCetiProject/TauCetiRoadmap "$RUNNER_TEMP/roadmaps"
          python3 scripts/named.py roadmaps "$RUNNER_TEMP/roadmaps"
          if ! git diff --quiet -- data/named-roadmaps.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "The roadmaps' named results, as they stand today" -- data/named-roadmaps.json
            for attempt in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((attempt * 5)); done
          fi
      - name: Pin Tau Ceti's current main
        id: pin
        run: |
          # The newest commit of main (among the last 30) that the pilot can extract a dataset of
          # cheaply: LeanTrustBuilders/extractor has a release for its toolchain, and Tau Ceti's
          # cache has published its build (its revision map). When main has moved to a toolchain
          # with no extractor release yet, the pin waits on the last commit before the move.
          supported=$(gh release list -R LeanTrustBuilders/extractor --limit 100 --json tagName \
            --jq '.[].tagName | sub("^v[0-9.]+-lean-"; "") | ltrimstr("v")')
          latest=""
          for sha in $(gh api "repos/TauCetiProject/TauCeti/commits?sha=main&per_page=30" --jq '.[].sha'); do
            toolchain=$(gh api "repos/TauCetiProject/TauCeti/contents/lean-toolchain?ref=$sha" --jq .content | base64 -d | tr -d '[:space:]')
            if ! grep -qxF "${toolchain#*:v}" <<< "$supported"; then
              [ -n "${warned:-}" ] || echo "::warning::Tau Ceti main (${sha:0:7}) is on $toolchain, which LeanTrustBuilders/extractor has no release for"
              warned=1; continue
            fi
            scope=$(printf '%s' "$toolchain" | sed 's|/|--|; s|:|---|')
            if curl -sfI "https://cache.taucetiproject.org/revisions/TauCetiProject/TauCeti/tc/$scope/$sha.jsonl" > /dev/null; then
              latest=$sha; break
            fi
          done
          if [ -z "$latest" ]; then echo "No recent commit to move to"; echo "moved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Pinning $latest"
          python3 - "$latest" <<'PY'
          import json, sys
          path = "data/settings.json"
          settings = json.load(open(path))
          settings["tauceti"] = sys.argv[1]
          open(path, "w").write(json.dumps(settings, indent=1) + "\n")
          PY
          if git diff --quiet; then echo "moved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Follow Tau Ceti to ${latest:0:7}"
          for attempt in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((attempt * 5)); done
          echo "moved=true" >> "$GITHUB_OUTPUT"
  dataset:
    needs: pin
    if: needs.pin.outputs.moved == 'true'
    uses: ./.github/workflows/dataset.yml
    permissions:
      contents: write
  site:
    # Built even when the dataset could not be (for instance, when Tau Ceti moved to a toolchain the
    # extractor has no release for yet): the page then reads declarations from the source.
    needs: [pin, dataset]
    if: always() && needs.pin.outputs.moved == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
