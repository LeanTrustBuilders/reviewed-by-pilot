name: Follow Tau Ceti

# Moves the page to Tau Ceti's current main once a day (extracting the dataset of
# the new commit), and records in the evidence store the named results and
# notable definitions the roadmaps' status files list and Voyager announced, so
# the page keeps up as the library grows. Reviews stay keyed by the meaning
# hashes they were made on: a declaration whose meaning changed shows its
# reviews greyed until someone reviews it again.
on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: follow-tauceti
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.pin.outputs.moved }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Tau Ceti's current main
        id: pin
        run: |
          # The newest commit of main (among the last 30) that the pilot can extract a dataset of
          # cheaply: LeanTrustBuilders/extractor has a release for its toolchain, and Tau Ceti's
          # cache has published its build (its revision map). When main has moved to a toolchain
          # with no extractor release yet, the pin waits on the last commit before the move.
          supported=$(gh release list -R LeanTrustBuilders/extractor --limit 100 --json tagName \
            --jq '.[].tagName | sub("^v[0-9.]+-lean-"; "") | ltrimstr("v")')
          latest=""
          for sha in $(gh api "repos/TauCetiProject/TauCeti/commits?sha=main&per_page=30" --jq '.[].sha'); do
            toolchain=$(gh api "repos/TauCetiProject/TauCeti/contents/lean-toolchain?ref=$sha" --jq .content | base64 -d | tr -d '[:space:]')
            if ! grep -qxF "${toolchain#*:v}" <<< "$supported"; then
              [ -n "${warned:-}" ] || echo "::warning::Tau Ceti main (${sha:0:7}) is on $toolchain, which LeanTrustBuilders/extractor has no release for"
              warned=1; continue
            fi
            scope=$(printf '%s' "$toolchain" | sed 's|/|--|; s|:|---|')
            if curl -sfI "https://cache.taucetiproject.org/revisions/TauCetiProject/TauCeti/tc/$scope/$sha.jsonl" > /dev/null; then
              latest=$sha; break
            fi
          done
          if [ -z "$latest" ]; then echo "No recent commit to move to"; echo "moved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Pinning $latest"
          python3 - "$latest" <<'PY'
          import json, sys
          path = "data/settings.json"
          settings = json.load(open(path))
          settings["tauceti"] = sys.argv[1]
          open(path, "w").write(json.dumps(settings, indent=1) + "\n")
          PY
          if git diff --quiet; then echo "moved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Follow Tau Ceti to ${latest:0:7}"
          for attempt in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((attempt * 5)); done
          echo "moved=true" >> "$GITHUB_OUTPUT"
  dataset:
    needs: pin
    if: needs.pin.outputs.moved == 'true'
    uses: ./.github/workflows/dataset.yml
    permissions:
      contents: write
  named:
    # Daily, since the roadmaps change more often than the pin moves; keyed in the dataset of the
    # pinned commit, so after the dataset job when the pin moved.
    needs: [pin, dataset]
    if: always() && needs.pin.result == 'success' && needs.dataset.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: declarations
        uses: ./.github/actions/declarations
        with:
          token: ${{ github.token }}
      - name: Record the roadmaps' named results and Voyager's announcements
        id: record
        env:
          DATASET: ${{ steps.declarations.outputs.dataset }}
        run: |
          git clone -q --depth 1 https://github.com/TauCetiProject/TauCetiRoadmap "$RUNNER_TEMP/roadmaps"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Records are appended to the store's files, as the intake appends them: start from the
          # branch's tip, record, commit, push; if someone pushed in between, do it all again (both
          # are idempotent).
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/named.py roadmaps "$RUNNER_TEMP/roadmaps" --dataset "$DATASET"
            python3 scripts/named.py voyager --dataset "$DATASET"
            if [ -z "$(git status --porcelain -- evidence data/voyager.jsonl)" ]; then
              echo "recorded=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git add evidence data/voyager.jsonl
            git commit -q -m "Named results from the roadmaps and Voyager, as they stand today"
            if git push -q origin HEAD:main; then echo "recorded=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the named results"; exit 1
  site:
    needs: [pin, dataset, named]
    if: always() && (needs.pin.outputs.moved == 'true' || needs.named.outputs.recorded == 'true')
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
