# Generated by evidence-store (`evidence-store init`).
# Checks every change to the evidence store: records valid, none changed or removed, and those a pull
# request adds written by its author.
name: Evidence check

on:
  pull_request:
    paths: ['evidence/**']
  push:
    branches: [main]
    paths: ['evidence/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: LeanTrustBuilders/evidence-store/check@main
        with:
          store: evidence
