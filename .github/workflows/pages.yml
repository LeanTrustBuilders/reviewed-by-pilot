name: Page

# Builds the search page of every Tau Ceti declaration (at the commit pinned in
# data/settings.json) and what the evidence store says of each, and publishes it. The intake
# (evidence-intake.yml) runs it after it records something.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: declarations
        uses: ./.github/actions/declarations
        with:
          token: ${{ github.token }}
      - run: python3 -m unittest discover -s tests
      - name: Build the page
        run: |
          # The stores this one imports (evidence/store.json): reviews made there of the Mathlib
          # declarations Tau Ceti rests on show on the page too, marked with their store.
          evidence-store fetch-imports --store evidence --out "$RUNNER_TEMP/imports"
          python3 scripts/build_site.py --dataset "${{ steps.declarations.outputs.dataset }}" --imports "$RUNNER_TEMP/imports"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
