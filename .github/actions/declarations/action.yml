name: Tau Ceti declarations
description: >-
  Check out Tau Ceti at the commit pinned in data/settings.json, download the dataset (S2) published
  for that commit, and read every declaration into data/declarations.json. Fails when no dataset is
  published: the Dataset workflow extracts one.
inputs:
  token:
    description: A token that can read this repository's releases.
    required: true
outputs:
  dataset:
    description: The directory of the dataset for the pinned commit.
    value: ${{ steps.dataset.outputs.path }}
runs:
  using: composite
  steps:
    - name: Check out Tau Ceti at the pinned commit
      shell: bash
      run: |
        commit=$(python3 -c "import json; print(json.load(open('data/settings.json'))['tauceti'])")
        echo "TAUCETI_COMMIT=$commit" >> "$GITHUB_ENV"
        git init -q "$RUNNER_TEMP/TauCeti"
        git -C "$RUNNER_TEMP/TauCeti" fetch -q --depth 1 https://github.com/TauCetiProject/TauCeti.git "$commit"
        git -C "$RUNNER_TEMP/TauCeti" checkout -q FETCH_HEAD
    - name: evidence-store and evidence-core
      shell: bash
      run: pip install --quiet "git+https://github.com/LeanTrustBuilders/evidence-store@main"
    - name: Declarations, from the dataset
      id: dataset
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # Where the store's config says datasets are (evidence/store.json): this repository's releases.
        if ! evidence-store dataset --commit "$TAUCETI_COMMIT" --out "$RUNNER_TEMP/dataset" > /dev/null; then
          echo "::error::No dataset published for Tau Ceti $TAUCETI_COMMIT: run the Dataset workflow"
          exit 1
        fi
        echo "path=$RUNNER_TEMP/dataset" >> "$GITHUB_OUTPUT"
        python3 scripts/dataset_declarations.py --dataset "$RUNNER_TEMP/dataset" --clone "$RUNNER_TEMP/TauCeti" --commit "$TAUCETI_COMMIT"
